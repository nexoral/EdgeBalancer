# 
  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 5c — Deploy to AWS ECS via Terraform (replaces k3s SSH deploy)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-aws-terraform:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: [changes, build-push-server]
    if: |
      always() &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.aws == 'true') &&
      needs.build-push-server.result != 'failure' &&
      needs.build-push-server.result != 'cancelled'
    env:
      # AWS credentials from GitHub Variables (as requested)
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      # Terraform variables passed as env (auto-masked by GitHub Actions)
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_docker_image: ${{ needs.build-push-server.outputs.image || format('ghcr.io/{0}/edgebalancer-server:latest', github.repository_owner) }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_mongodb_uri: ${{ secrets.MONGODB_URI }}
      TF_VAR_client_url: ${{ secrets.CLIENT_URL }}
      TF_VAR_cors_origin: ${{ secrets.CORS_ORIGIN }}
      TF_VAR_cf_origin_cert: ${{ secrets.CF_ORIGIN_CERT }}
      TF_VAR_cf_origin_key: ${{ secrets.CF_ORIGIN_KEY }}
      TF_VAR_firebase_project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      TF_VAR_firebase_client_email: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      TF_VAR_firebase_private_key: ${{ secrets.FIREBASE_PRIVATE_KEY }}
      TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
      TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      TF_VAR_cloudflare_oauth_client_id: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_ID }}
      TF_VAR_cloudflare_oauth_client_secret: ${{ secrets.CLOUDFLARE_OAUTH_CLIENT_SECRET }}
      TF_VAR_cloudflare_oauth_redirect_uri: ${{ secrets.CLOUDFLARE_OAUTH_REDIRECT_URI }}
      TF_VAR_cashfree_app_id: ${{ secrets.CASHFREE_APP_ID }}
      TF_VAR_cashfree_secret_key: ${{ secrets.CASHFREE_SECRET_KEY }}
      TF_VAR_cashfree_env: ${{ secrets.CASHFREE_ENV }}
    steps:
      - name: Mask AWS credentials
        run: |
          echo "::add-mask::${{ vars.AWS_ACCESS_KEY_ID }}"
          echo "::add-mask::${{ vars.AWS_SECRET_ACCESS_KEY }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6+"

      - name: Terraform Init
        working-directory: aws
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: aws
        run: terraform validate

      - name: Terraform Apply
        working-directory: aws
        run: terraform apply -auto-approve
        env:
          TF_LOG: INFO

      - name: Deploy new container
        working-directory: aws
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Annotate summary
        run: |
          IMAGE="${{ needs.build-push-server.outputs.image }}"
          VERSION="${{ needs.build-push-server.outputs.version }}"
          echo "## Deployed to AWS ECS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail  | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image   | \`$IMAGE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region  | \`${{ vars.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Target  | ECS on Fargate |" >> $GITHUB_STEP_SUMMARY
          echo "| Status  | deployed |" >> $GITHUB_STEP_SUMMARY
