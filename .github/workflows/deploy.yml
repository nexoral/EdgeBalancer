name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'k8s/**'
      - 'aws/**'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 1 — Detect which paths changed
  # ─────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      k8s: ${{ steps.filter.outputs.k8s }}
      aws: ${{ steps.filter.outputs.aws }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'
            k8s:
              - 'k8s/**'
            aws:
              - 'aws/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 2 — Build (client-build runs only for client changes)
  # ─────────────────────────────────────────────────────────────────────────────
  client-build:
    name: Client — Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true'
    env:
      NEXT_PUBLIC_CASHFREE_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 3 — Tests (client-test and server-test run in PARALLEL)
  # ─────────────────────────────────────────────────────────────────────────────
  client-test:
    name: Client — Test
    runs-on: ubuntu-latest
    needs: [changes, client-build]
    if: needs.client-build.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Run tests
        run: cd client && npm test

      - name: Annotate summary
        run: |
          echo "## Client — Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check  | Status  |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build  | passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests  | passed |" >> $GITHUB_STEP_SUMMARY

  server-test:
    name: Server — Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    env:
      JWT_SECRET: test-jwt-secret-for-ci-do-not-use-in-production
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NODE_ENV: test
      PORT: "0"
      CLIENT_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      # MONGODB_URI is provided at runtime by mongodb-memory-server in globalSetup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run tests
        run: cd server && npm test

      - name: Annotate summary
        run: |
          echo "## Server — Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check  | Status  |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build  | passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests  | passed |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 4 — Build Docker image and push to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build-push-server:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04-arm
    needs: [changes, server-test]
    if: |
      needs.changes.outputs.server == 'true' &&
      needs.server-test.result == 'success'
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get server version
        id: version
        run: echo "version=$(node -p "require('./server/package.json').version")" >> $GITHUB_OUTPUT

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.owner.outputs.name }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag output
        id: image-tag
        run: echo "image=ghcr.io/${{ steps.owner.outputs.name }}/edgebalancer-server:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/edgebalancer-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.name }}/edgebalancer-server:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.name }}/edgebalancer-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete old GHCR versions (keep current + 2 previous)
        uses: actions/delete-package-versions@v5
        with:
          package-name: edgebalancer-server
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Annotate summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Docker Image — Built & Pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version  | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image    | \`ghcr.io/${{ steps.owner.outputs.name }}/edgebalancer-server:$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag  | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | linux/arm64 (Graviton) |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | GHCR |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 5a — Apply k8s config (ONLY when k8s/** changes)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-k3s-config:
    name: Apply k8s Config
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          source: "k8s"
          target: "~/k8s-deploy/"

      - name: Apply manifests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            if ! command -v k3s >/dev/null 2>&1; then
              curl -sfL https://get.k3s.io | sudo sh -
            fi

            if ! sudo systemctl is-active --quiet k3s; then
              sudo systemctl start k3s
            fi

            for attempt in $(seq 1 60); do
              if sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "k3s did not become ready"
                exit 1
              fi
              sleep 2
            done

            sudo k3s kubectl create namespace edgebalancer --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl apply -f ~/k8s-deploy/k8s/
            rm -rf ~/k8s-deploy
            echo "k8s config applied successfully!"

      - name: Annotate summary
        run: |
          echo "## k8s Config Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Manifests | Deployment, HPA, Service, Ingress, Redis |" >> $GITHUB_STEP_SUMMARY
          echo "| Host     | \`${{ vars.SERVER_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status   | applied |" >> $GITHUB_STEP_SUMMARY

